services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: gateway
      POSTGRES_PASSWORD: gateway
      POSTGRES_DB: whatsapp_gateway
    ports:
      - "5433:5432"
    volumes:
      - gateway_pg_data:/var/lib/postgresql/data

volumes:
  gateway_pg_data:
